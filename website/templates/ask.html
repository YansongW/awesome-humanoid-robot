{% extends "base.html" %}

{% set active_nav = 'ask' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
{% set bp = '' if lang == 'zh' else '/' + lang %}
<div class="container ask-container">
  <section class="ask-hero">
    <h1>{{ ui.ask_title }}</h1>
    <p class="ask-subtitle">{{ ui.ask_subtitle }}</p>
  </section>

  <section id="ask-root"
    data-base-path="{{ bp }}"
    data-empty="{{ ui.ask_empty }}"
    data-input-placeholder="{{ ui.ask_input_placeholder }}"
    data-send="{{ ui.ask_send }}"
    data-stop="{{ ui.ask_stop }}"
    data-settings="{{ ui.ask_settings }}"
    data-settings-title="{{ ui.ask_settings_title }}"
    data-provider="{{ ui.ask_provider }}"
    data-provider-custom="{{ ui.ask_provider_custom }}"
    data-base-url="{{ ui.ask_base_url }}"
    data-model="{{ ui.ask_model }}"
    data-save="{{ ui.ask_save }}"
    data-clear="{{ ui.ask_clear }}"
    data-privacy-note="{{ ui.ask_privacy_note }}"
    data-sources="{{ ui.ask_sources }}"
    data-thinking="{{ ui.ask_thinking }}"
    data-no-key="{{ ui.ask_no_key }}"
    data-no-context="{{ ui.ask_no_context }}"
    data-stopped="{{ ui.ask_stopped }}"
    data-error-network="{{ ui.ask_error_network }}"
    data-error-auth="{{ ui.ask_error_auth }}"
    data-error-rate="{{ ui.ask_error_rate }}"
    data-error-generic="{{ ui.ask_error_generic }}"
    data-settings-saved="{{ ui.ask_settings_saved }}"
    data-settings-cleared="{{ ui.ask_settings_cleared }}"
    data-clear-history="{{ ui.ask_clear_history }}"
    data-stage-retrieving="{{ ui.ask_stage_retrieving }}"
    data-stage-loading="{{ ui.ask_stage_loading }}"
    data-stage-generating="{{ ui.ask_stage_generating }}">
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="/js/search.js"></script>
<script src="/js/ask.js"></script>
{% endblock %}
